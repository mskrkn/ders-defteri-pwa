<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ders Defteri</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f4e">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ders Defteri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f4ee;
    --paper-raised: #ffffff;
    --ink: #212a23;
    --ink-soft: #5c6259;
    --accent: #2f6f4e;
    --accent-soft: #e4efe7;
    --warn: #c1440e;
    --warn-soft: #fbe6db;
    --line: #ddd7c8;
    --line-strong: #c7c0ac;
    --shadow: 0 1px 2px rgba(33,42,35,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b1f1c;
      --paper-raised: #242923;
      --ink: #eae7dd;
      --ink-soft: #a3a99b;
      --accent: #6bbf8f;
      --accent-soft: #26362c;
      --warn: #e28a5f;
      --warn-soft: #3a2620;
      --line: #363c34;
      --line-strong: #454c41;
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b1f1c;
    --paper-raised: #242923;
    --ink: #eae7dd;
    --ink-soft: #a3a99b;
    --accent: #6bbf8f;
    --accent-soft: #26362c;
    --warn: #e28a5f;
    --warn-soft: #3a2620;
    --line: #363c34;
    --line-strong: #454c41;
    --shadow: 0 1px 3px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display {
    font-family: 'Zilla Slab', Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }
  #app { max-width: 820px; margin: 0 auto; padding: 20px 16px 90px; }

  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  header.top h1 { font-size: 22px; }
  header.top .date { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .today-summary { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--ink-soft); font-size: 13px; margin: -8px 0 18px; }
  .today-summary strong { color: var(--ink); }
  .notif-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    padding: 6px 11px 6px 9px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .notif-toggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .notif-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
  .notif-toggle.on .notif-dot { background: var(--accent); }

  .warn-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--warn-soft);
    border: 1px solid var(--warn);
    color: var(--warn);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13.5px;
  }
  .warn-banner strong { color: var(--warn); }
  .warn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }

  section { margin-bottom: 22px; }
  .section-label {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card + .card { margin-top: 10px; }

  .lesson-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-left: 3px solid var(--line-strong);
  }
  .lesson-row.done { border-left-color: var(--accent); }
  .lesson-row.missed { border-left-color: var(--warn); }
  .lesson-row .info { flex: 1; min-width: 0; }
  .lesson-row .name { font-weight: 600; font-size: 15px; }
  .lesson-row .time { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .lesson-row .note { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; font-style: italic; }

  .toggle-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .toggle-btn {
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
  }
  .toggle-btn.active-yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toggle-btn.active-no { background: var(--warn); border-color: var(--warn); color: #fff; }

  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  nav.tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--paper-raised);
    border-top: 1px solid var(--line);
    display: flex;
    max-width: 820px;
    margin: 0 auto;
  }
  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 4px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  nav.tabs button.active { color: var(--accent); font-weight: 600; }
  nav.tabs button .icon { display: block; font-size: 18px; margin-bottom: 2px; }

  /* Students tab */
  .student-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    border-bottom: 1px solid var(--line);
  }
  .student-item:last-child { border-bottom: none; }
  .student-item .info { flex: 1; min-width: 0; }
  .student-item .name { font-weight: 600; }
  .student-item .schedule { font-size: 12.5px; color: var(--ink-soft); }
  .student-item { cursor: pointer; }
  .student-item:hover { background: var(--accent-soft); }
  .search-input { width: 100%; margin-bottom: 10px; background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 9px; padding: 11px 12px; color: var(--ink); font: inherit; }
  .detail-header { margin-bottom: 16px; }
  .detail-header h2 { font-size: 24px; }
  .detail-subtitle { color: var(--ink-soft); margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 9px; padding: 11px; }
  .stat strong { display: block; font-size: 20px; }
  .stat span { color: var(--ink-soft); font-size: 12px; }
  .progress { height: 8px; background: var(--line); border-radius: 8px; overflow: hidden; margin: 8px 0 16px; }
  .progress > span { display: block; height: 100%; background: var(--accent); }
  .history-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .history-item:last-child { border-bottom: none; }
  .history-item button { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; }
  .icon-btn {
    background: none; border: none; color: var(--ink-soft);
    font-size: 15px; cursor: pointer; padding: 6px;
  }

  .fab {
    position: fixed;
    right: 16px; bottom: 76px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 26px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    cursor: pointer;
    max-width: 820px;
  }

  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end;
    z-index: 20;
  }
  .sheet {
    background: var(--paper-raised);
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    border-radius: 16px 16px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet h2 { font-size: 18px; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 11px;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-grid button {
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 0;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .day-grid button.selected { background: var(--accent); border-color: var(--accent); color: #fff; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 9px;
    border: 1px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }

  /* Monthly tab */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav button {
    background: var(--paper-raised); border: 1px solid var(--line-strong);
    border-radius: 8px; width: 34px; height: 34px; font-size: 15px; cursor: pointer; color: var(--ink);
  }
  .month-nav .label { font-family: 'Zilla Slab', serif; font-size: 16px; font-weight: 600; }

  .month-block { margin-bottom: 16px; }
  .month-block .student-name { font-weight: 600; margin-bottom: 8px; font-size: 14.5px; }
  .day-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-chip {
    width: 38px; height: 38px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    font-size: 11px;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    background: var(--paper-raised);
    cursor: pointer;
  }
  .day-chip .d { font-weight: 600; font-size: 12.5px; color: var(--ink); }
  .day-chip.done { background: var(--accent-soft); border-color: var(--accent); }
  .day-chip.done .d { color: var(--accent); }
  .day-chip.missed { background: var(--warn-soft); border-color: var(--warn); }
  .day-chip.missed .d { color: var(--warn); }
  .day-chip.future { opacity: 0.45; cursor: default; }

  .stats-line { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); }
  .settings-row:last-child { border-bottom: 0; }
  .settings-row small { display: block; color: var(--ink-soft); margin-top: 2px; }
  .settings-row select { background: var(--paper); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px; font: inherit; }
  .settings-actions { display: grid; gap: 8px; }
  @media (min-width: 680px) { .lesson-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .lesson-list .card + .card { margin-top: 0; } }
  @media (max-width: 420px) { .stat-grid { gap: 5px; } .stat { padding: 9px 7px; } }

  .loading { text-align: center; padding: 60px 0; color: var(--ink-soft); font-size: 13px; }
</style>
</head>
<body>
<div id="app"><div class="loading">Yükleniyor…</div></div>

<script>
const DAY_NAMES = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const DAY_SHORT = ["Pz","Pt","Sa","Ça","Pe","Cu","Ct"];

let students = [];
let attendance = {}; // key `${studentId}__${date}` -> {status}
const STORAGE_STUDENTS = 'dd_students_v1';
const STORAGE_ATTEND = 'dd_attendance_v1';
const STORAGE_SETTINGS = 'dd_settings_v1';

function loadStudents() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_STUDENTS) || '[]');
    return Array.isArray(saved) ? saved.map(s => ({ ...s, grade: s.grade || '', subject: s.subject || '', note: s.note || '' })) : [];
  } catch(e) { return []; }
}
function persistStudents() {
  try { localStorage.setItem(STORAGE_STUDENTS, JSON.stringify(students)); } catch(e) {}
}
function loadAttendance() {
  try { return JSON.parse(localStorage.getItem(STORAGE_ATTEND) || '{}'); } catch(e) { return {}; }
}
function persistAttendance() {
  try { localStorage.setItem(STORAGE_ATTEND, JSON.stringify(attendance)); } catch(e) {}
}
function newId() {
  return (crypto.randomUUID ? crypto.randomUUID() : 's_' + Date.now() + '_' + Math.random().toString(36).slice(2));
}
let activeTab = 'today';
let monthCursor = new Date(); monthCursor.setDate(1);
let editingStudent = null; // student object or 'new' or null
let activeStudentId = null;
let modal = null; // {title, message, actions:[{label, cls, onClick}]}
let settings = {};

try { settings = JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || '{}'); } catch(e) { settings = {}; }

function persistSettings() {
  try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings)); } catch(e) {}
}

function applyTheme() {
  const theme = settings.theme || 'system';
  if (theme === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
}

let notifEnabled = false;
try { notifEnabled = localStorage.getItem('notifEnabled') === '1'; } catch(e) {}

function notifiedSet() {
  try { return JSON.parse(localStorage.getItem('notifiedKeys') || '{}'); }
  catch(e) { return {}; }
}
function markNotified(key) {
  try {
    const set = notifiedSet();
    set[key] = Date.now();
    localStorage.setItem('notifiedKeys', JSON.stringify(set));
  } catch(e) {}
}
function wasNotified(key) { return !!notifiedSet()[key]; }

function sendNotification(title, body) {
  if (!notifEnabled) return;
  if (typeof Notification === 'undefined') return;
  if (Notification.permission !== 'granted') return;
  try { new Notification(title, { body }); } catch(e) {}
}

async function toggleNotifications() {
  if (notifEnabled) {
    notifEnabled = false;
    try { localStorage.setItem('notifEnabled', '0'); } catch(e) {}
    render();
    return;
  }
  if (typeof Notification === 'undefined') {
    modal = { title: 'Bildirimler desteklenmiyor', message: 'Bu tarayıcı bildirim özelliğini desteklemiyor.', actions: [{ label: 'Tamam', cls: '' }] };
    render();
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    notifEnabled = true;
    try { localStorage.setItem('notifEnabled', '1'); } catch(e) {}
    sendNotification('Bildirimler açık', 'Ders hatırlatmaları ve yoklama uyarıları artık gelecek.');
  }
  render();
}

function checkReminders() {
  if (!notifEnabled) return;
  const now = new Date();
  const tKey = todayKey();
  studentsToday().forEach(s => {
    const [h, m] = (s.time || '00:00').split(':').map(Number);
    const lessonTime = new Date(); lessonTime.setHours(h, m, 0, 0);
    const msToLesson = lessonTime - now;

    const beforeKey = `before__${s.id}__${tKey}`;
    if (msToLesson > 0 && msToLesson <= 15 * 60 * 1000 && !wasNotified(beforeKey)) {
      sendNotification('Yaklaşan ders', `${s.name} ile bugün saat ${s.time} dersiniz var.`);
      markNotified(beforeKey);
    }

    const rec = attendance[`${s.id}__${tKey}`];
    if (!rec && msToLesson < 0) {
      const minutesLate = Math.floor(-msToLesson / 60000);
      const bucket = Math.floor(minutesLate / 30);
      const key = `after__${s.id}__${tKey}__${bucket}`;
      if (minutesLate >= 10 && !wasNotified(key)) {
        sendNotification('Yoklama eksik', `${s.name} için yoklama henüz alınmadı.`);
        markNotified(key);
      }
    }
  });
}

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return dateKey(new Date()); }

function init() {
  students = loadStudents().sort((a,b) => (a.day - b.day) || (a.time||'').localeCompare(b.time||''));
  attendance = loadAttendance();
  applyTheme();
  render();
  checkReminders();
  setInterval(checkReminders, 30000);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function studentsToday() {
  const dow = new Date().getDay();
  return students.filter(s => s.day === dow);
}

function markAttendance(studentId, date, status) {
  const key = `${studentId}__${date}`;
  const current = attendance[key];
  const newStatus = (current && current.status === status) ? null : status;
  if (newStatus === null) {
    delete attendance[key];
  } else {
    attendance[key] = { studentId, date, status: newStatus, markedAt: Date.now() };
  }
  persistAttendance();
  render();
}

function saveStudent(data) {
  if (data.id) {
    const idx = students.findIndex(s => s.id === data.id);
    if (idx !== -1) students[idx] = { ...students[idx], name: data.name, grade: data.grade || '', subject: data.subject || '', day: data.day, time: data.time, note: data.note || "" };
  } else {
    students.push({ id: newId(), name: data.name, grade: data.grade || '', subject: data.subject || '', day: data.day, time: data.time, note: data.note || "" });
  }
  students.sort((a,b) => (a.day - b.day) || (a.time||'').localeCompare(b.time||''));
  persistStudents();
  render();
}

function deleteStudent(id) {
  students = students.filter(s => s.id !== id);
  Object.keys(attendance).forEach(key => { if (key.startsWith(`${id}__`)) delete attendance[key]; });
  persistStudents();
  persistAttendance();
  if (activeStudentId === id) activeStudentId = null;
  render();
}

function render() {
  const app = document.getElementById('app');
  const now = new Date();
  const dateStr = now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });

  let body = '';
  if (activeTab === 'today') body = renderToday();
  else if (activeTab === 'students') body = renderStudents();
  else if (activeTab === 'month') body = renderMonth();
  else if (activeTab === 'settings') body = renderSettings();

  app.innerHTML = `
    <header class="top">
      <div>
        <h1>Ders Defteri</h1>
        <div class="date">${dateStr}</div>
      </div>
      <button class="icon-btn" id="header-settings" aria-label="Ayarlar">⚙</button>
    </header>
    ${body}
    <nav class="tabs">
      <button class="${activeTab==='today'?'active':''}" data-tab="today"><span class="icon">📋</span>Bugün</button>
      <button class="${activeTab==='students'?'active':''}" data-tab="students"><span class="icon">🧑‍🎓</span>Öğrenciler</button>
      <button class="${activeTab==='month'?'active':''}" data-tab="month"><span class="icon">🗓️</span>Aylık Özet</button>
      <button class="${activeTab==='settings'?'active':''}" data-tab="settings"><span class="icon">⚙</span>Ayarlar</button>
    </nav>
    ${activeTab==='students' ? '<button class="fab" id="add-student-fab">+</button>' : ''}
  `;

  app.querySelectorAll('nav.tabs button').forEach(b => {
    b.addEventListener('click', () => { activeTab = b.dataset.tab; render(); });
  });
  const settingsBtn = document.getElementById('header-settings');
  if (settingsBtn) settingsBtn.addEventListener('click', () => { activeTab = 'settings'; render(); });

  if (activeTab === 'today') bindTodayEvents();
  if (activeTab === 'students') bindStudentsEvents();
  if (activeTab === 'month') bindMonthEvents();
  if (activeTab === 'settings') bindSettingsEvents();

  if (editingStudent) renderSheet();
  if (modal) renderModal();
}

function renderModal() {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="sheet">
      <h2>${escapeHtml(modal.title)}</h2>
      <p style="color:var(--ink-soft);font-size:14px;margin-bottom:18px;line-height:1.5;">${escapeHtml(modal.message)}</p>
      <div class="sheet-actions" id="modal-actions"></div>
    </div>`;
  document.body.appendChild(wrap);
  const actionsEl = wrap.querySelector('#modal-actions');
  modal.actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = `btn ${a.cls || ''}`;
    btn.textContent = a.label;
    btn.addEventListener('click', () => {
      const action = a.onClick;
      modal = null;
      wrap.remove();
      if (action) action();
    });
    actionsEl.appendChild(btn);
  });
  wrap.addEventListener('click', (e) => { if (e.target === wrap) { modal = null; wrap.remove(); } });
}

function renderToday() {
  const list = studentsToday();
  const tKey = todayKey();
  const now = new Date();

  const missed = list.filter(s => {
    const rec = attendance[`${s.id}__${tKey}`];
    if (rec) return false;
    const [h,m] = (s.time||'00:00').split(':').map(Number);
    const lessonTime = new Date(); lessonTime.setHours(h,m,0,0);
    return now >= lessonTime;
  });

  const completed = list.filter(s => attendance[`${s.id}__${tKey}`]?.status === 'yes');
  const pending = list.filter(s => (!attendance[`${s.id}__${tKey}`] || attendance[`${s.id}__${tKey}`].status === 'note') && new Date() < lessonDate(s));
  const missing = list.filter(s => (!attendance[`${s.id}__${tKey}`] || attendance[`${s.id}__${tKey}`].status === 'note') && new Date() >= lessonDate(s));
  let html = `<div class="today-summary"><span>Bugün <strong>${list.length} ders</strong></span><span>✓ <strong>${completed.length} tamamlandı</strong></span><span>🕐 <strong>${pending.length} bekliyor</strong></span><span>! <strong>${missing.length} eksik</strong></span></div>`;
  if (missing.length > 0) {
    html += `<div class="warn-banner"><span class="warn-dot"></span><span><strong>${missing.length} ders</strong> için henüz yoklama işaretlenmedi.</span></div>`;
  }

  html += `<section><div class="section-label">BUGÜNKÜ DERSLER</div>`;
  if (list.length === 0) {
    html += `<div class="card"><div class="empty">Bugün planlı ders yok.</div></div>`;
  } else {
    html += `<div class="lesson-list">`;
    list.forEach((s, i) => {
      const rec = attendance[`${s.id}__${tKey}`];
      const status = rec ? rec.status : null;
      const rowClass = status === 'yes' ? 'done' : (status === 'no' ? 'missed' : '');
      html += `
        <div class="card"><div class="lesson-row ${rowClass}">
          <div class="info">
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="time">${escapeHtml([s.grade, s.subject].filter(Boolean).join(' · '))}</div>
            <div class="time">${s.time || '—'}</div>
            ${s.note ? `<div class="note">${escapeHtml(s.note)}</div>` : ''}
          </div>
          <div class="toggle-btns">
            <button class="toggle-btn ${status==='yes'?'active-yes':''}" data-id="${s.id}" data-status="yes">Geldi</button>
            <button class="toggle-btn ${status==='no'?'active-no':''}" data-id="${s.id}" data-status="no">Gelmedi</button>
          </div>
        </div><button class="icon-btn lesson-note-btn" data-note-id="${s.id}" data-note-date="${tKey}">Not ekle</button></div>`;
    });
    html += `</div>`;
  }
  html += `</section>`;
  return html;
}

function bindTodayEvents() {
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.addEventListener('click', () => {
      markAttendance(b.dataset.id, todayKey(), b.dataset.status);
    });
  });
  document.querySelectorAll('.lesson-note-btn').forEach(b => b.addEventListener('click', () => openLessonNote(b.dataset.noteId, b.dataset.noteDate)));
}

function renderStudents() {
  if (activeStudentId) return renderStudentDetail(activeStudentId);
  const query = (window.studentSearchQuery || '').trim().toLocaleLowerCase('tr-TR');
  const visibleStudents = students.filter(s => s.name.toLocaleLowerCase('tr-TR').includes(query));
  let html = `<section><div class="section-label">ÖĞRENCİLER</div><input class="search-input" id="student-search" type="search" placeholder="Öğrenci ara..." value="${escapeAttr(window.studentSearchQuery || '')}">`;
  if (students.length === 0) {
    html += `<div class="card"><div class="empty">Henüz öğrenci eklenmedi. Sağ alttaki + ile ekle.</div></div>`;
  } else {
    html += `<div class="card">`;
    visibleStudents.forEach(s => {
      html += `
        <div class="student-item" data-student="${s.id}">
          <div class="info">
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="schedule">${escapeHtml([s.grade, s.subject].filter(Boolean).join(' · '))}</div>
            <div class="schedule">${DAY_NAMES[s.day]} · ${s.time || '—'}</div>
          </div>
          <button class="icon-btn" data-edit="${s.id}">✎</button>
          <button class="icon-btn" data-del="${s.id}">🗑</button>
        </div>`;
    });
    if (!visibleStudents.length) html += `<div class="empty">Aramanla eşleşen öğrenci yok.</div>`;
    html += `</div>`;
  }
  html += `</section>`;
  return html;
}

function bindStudentsEvents() {
  const search = document.getElementById('student-search');
  if (search) search.addEventListener('input', () => { window.studentSearchQuery = search.value; render(); const next = document.getElementById('student-search'); if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); } });
  const fab = document.getElementById('add-student-fab');
  if (fab) fab.addEventListener('click', () => { editingStudent = 'new'; render(); });
  document.querySelectorAll('[data-edit]').forEach(b => {
    b.addEventListener('click', () => {
      editingStudent = students.find(s => s.id === b.dataset.edit);
      render();
    });
  });
  document.querySelectorAll('[data-student]').forEach(b => b.addEventListener('click', () => { activeStudentId = b.dataset.student; render(); }));
  document.querySelectorAll('[data-edit],[data-del]').forEach(b => b.addEventListener('click', e => e.stopPropagation()));
  document.querySelectorAll('[data-history-note]').forEach(b => b.addEventListener('click', () => openLessonNote(b.dataset.historyNote, b.dataset.historyDate)));
  const detailBack = document.getElementById('detail-back');
  if (detailBack) detailBack.addEventListener('click', () => { activeStudentId = null; render(); });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => {
      const s = students.find(x => x.id === b.dataset.del);
      modal = {
        title: 'Öğrenciyi sil',
        message: `${s ? s.name : 'Bu öğrenci'} silinsin mi? Bu işlem geri alınamaz.`,
        actions: [
          { label: 'Vazgeç', cls: '' },
          { label: 'Sil', cls: 'danger', onClick: () => deleteStudent(b.dataset.del) }
        ]
      };
      render();
    });
  });
}

function lessonDate(student, date = new Date()) {
  const result = new Date(date);
  const [hours, minutes] = (student.time || '00:00').split(':').map(Number);
  result.setHours(hours || 0, minutes || 0, 0, 0);
  return result;
}

function renderStudentDetail(id) {
  const student = students.find(s => s.id === id);
  if (!student) { activeStudentId = null; return renderStudents(); }
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const records = Object.values(attendance).filter(r => r.studentId === id && r.date && r.date >= dateKey(monthStart) && r.date <= todayKey());
  const done = records.filter(r => r.status === 'yes').length;
  const missed = records.filter(r => r.status === 'no').length;
  const planned = records.length + (student.day === now.getDay() && now >= lessonDate(student) ? 0 : 0);
  const rate = planned ? Math.round((done / planned) * 100) : 0;
  const history = Object.values(attendance).filter(r => r.studentId === id).sort((a,b) => b.date.localeCompare(a.date)).slice(0, 12);
  return `<section>
    <button class="icon-btn" id="detail-back">← Öğrencilere dön</button>
    <div class="detail-header"><h2>${escapeHtml(student.name)}</h2><div class="detail-subtitle">${escapeHtml([student.grade, student.subject].filter(Boolean).join(' · '))}</div><div class="detail-subtitle">${DAY_NAMES[student.day]} · ${student.time || '—'}</div></div>
    <div class="section-label">BU AY</div>
    <div class="stat-grid"><div class="stat"><strong>${done}</strong><span>Tamamlandı</span></div><div class="stat"><strong>${missed}</strong><span>Gelmedi</span></div><div class="stat"><strong>${Math.max(0, planned - done - missed)}</strong><span>Bekliyor</span></div></div>
    <div class="section-label">DEVAM DURUMU · ${rate}%</div><div class="progress"><span style="width:${rate}%"></span></div>
    <div class="section-label">DERS GEÇMİŞİ</div><div class="card"><div style="padding:0 14px">${history.length ? history.map(r => `<div class="history-item"><span>${escapeHtml(formatDate(r.date))} ${r.status === 'yes' ? '✓' : '!'}</span><button data-history-note="${id}" data-history-date="${r.date}">${r.note && (r.note.topic || r.note.homework || r.note.text) ? 'Notu aç' : 'Not ekle'}</button></div>`).join('') : '<div class="empty">Henüz ders kaydı yok.</div>'}</div></div>
  </section>`;
}

function formatDate(value) {
  const [year, month, day] = value.split('-');
  return `${day}.${month}.${year}`;
}

function openLessonNote(studentId, date) {
  const key = `${studentId}__${date}`;
  const existing = attendance[key] && attendance[key].note || {};
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = `<div class="sheet"><h2>Ders Notu · ${formatDate(date)}</h2><div class="field"><label>Bugünkü konu</label><input id="note-topic" value="${escapeAttr(existing.topic || '')}"></div><div class="field"><label>Ödev</label><input id="note-homework" value="${escapeAttr(existing.homework || '')}"></div><div class="field"><label>Kısa not</label><textarea id="note-text">${escapeHtml(existing.text || '')}</textarea></div><div class="sheet-actions"><button class="btn" id="note-cancel">Vazgeç</button><button class="btn primary" id="note-save">Kaydet</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#note-cancel').addEventListener('click', () => wrap.remove());
  wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
  wrap.querySelector('#note-save').addEventListener('click', () => {
    attendance[key] = { ...(attendance[key] || { studentId, date, status: 'note' }), note: { topic: wrap.querySelector('#note-topic').value.trim(), homework: wrap.querySelector('#note-homework').value.trim(), text: wrap.querySelector('#note-text').value.trim() } };
    persistAttendance();
    wrap.remove();
    render();
  });
}

function renderSettings() {
  return `<section><div class="section-label">AYARLAR</div><div class="card"><div class="settings-row"><div><strong>Bildirimler</strong><small>Ders zamanı yaklaşınca hatırlat</small></div><button class="toggle-btn ${notifEnabled ? 'active-yes' : ''}" id="settings-notif">${notifEnabled ? 'Açık' : 'Kapalı'}</button></div><div class="settings-row"><div><strong>Görünüm</strong><small>Sistem, açık veya koyu tema</small></div><select id="theme-select"><option value="system">Sistem</option><option value="light">Açık</option><option value="dark">Koyu</option></select></div></div></section><section><div class="section-label">VERİLER</div><div class="card settings-actions" style="padding:14px"><button class="btn primary" id="export-data">Verileri yedekle</button><button class="btn" id="import-data">Yedekten geri yükle</button><input type="file" id="import-file" accept="application/json" hidden></div></section>`;
}

function bindSettingsEvents() {
  const theme = document.getElementById('theme-select');
  if (theme) { theme.value = settings.theme || 'system'; theme.addEventListener('change', () => { settings.theme = theme.value; persistSettings(); applyTheme(); }); }
  const notif = document.getElementById('settings-notif');
  if (notif) notif.addEventListener('click', toggleNotifications);
  document.getElementById('export-data').addEventListener('click', exportData);
  document.getElementById('import-data').addEventListener('click', () => document.getElementById('import-file').click());
  document.getElementById('import-file').addEventListener('change', importData);
  document.querySelectorAll('[data-history-note]').forEach(b => b.addEventListener('click', () => openLessonNote(b.dataset.historyNote, b.dataset.historyDate)));
  const back = document.getElementById('detail-back');
  if (back) back.addEventListener('click', () => { activeStudentId = null; render(); });
}

function exportData() {
  const payload = { version: 2, exportedAt: new Date().toISOString(), students, attendance, settings: { ...settings, notifEnabled } };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `ders-defteri-${todayKey()}.json`;
  link.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const payload = JSON.parse(reader.result);
      if (!payload || !Array.isArray(payload.students) || !payload.attendance || typeof payload.attendance !== 'object') throw new Error('Geçersiz yedek');
      modal = { title: 'Yedeği geri yükle', message: 'Mevcut verilerin üzerine yazılacak. Devam etmek istiyor musun?', actions: [{ label: 'Vazgeç', cls: '' }, { label: 'Geri yükle', cls: 'primary', onClick: () => { students = payload.students.map(s => ({ ...s, grade: s.grade || '', subject: s.subject || '', note: s.note || '' })); attendance = payload.attendance; settings = payload.settings || {}; notifEnabled = !!settings.notifEnabled; persistStudents(); persistAttendance(); persistSettings(); applyTheme(); activeStudentId = null; render(); } }] };
      render();
    } catch (e) { modal = { title: 'Yedek yüklenemedi', message: 'Dosya bozuk veya bu uygulamaya ait değil.', actions: [{ label: 'Tamam', cls: '' }] }; render(); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function renderSheet() {
  const isNew = editingStudent === 'new';
  const s = isNew ? { name: '', day: new Date().getDay(), time: '', note: '' } : editingStudent;
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'sheet-backdrop';
  wrap.innerHTML = `
    <div class="sheet">
      <h2>${isNew ? 'Öğrenci Ekle' : 'Öğrenciyi Düzenle'}</h2>
      <div class="field">
        <label>İsim</label>
        <input type="text" id="f-name" value="${escapeAttr(s.name)}" placeholder="Öğrenci adı">
      </div>
      <div class="field">
        <label>Sınıf</label>
        <input type="text" id="f-grade" value="${escapeAttr(s.grade || '')}" placeholder="Örn. 8. sınıf">
      </div>
      <div class="field">
        <label>Ders</label>
        <input type="text" id="f-subject" value="${escapeAttr(s.subject || '')}" placeholder="Örn. Matematik">
      </div>
      <div class="field">
        <label>Ders Günü</label>
        <div class="day-grid" id="f-day">
          ${DAY_SHORT.map((d,i) => `<button type="button" data-day="${i}" class="${s.day===i?'selected':''}">${d}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>Saat</label>
        <input type="time" id="f-time" value="${s.time||''}">
      </div>
      <div class="field">
        <label>Not (opsiyonel)</label>
        <textarea id="f-note" placeholder="Konu, ödev, adres vb.">${escapeHtml(s.note||'')}</textarea>
      </div>
      <div class="sheet-actions">
        <button class="btn" id="f-cancel">Vazgeç</button>
        <button class="btn primary" id="f-save">Kaydet</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);

  let selectedDay = s.day;
  wrap.querySelectorAll('#f-day button').forEach(b => {
    b.addEventListener('click', () => {
      selectedDay = Number(b.dataset.day);
      wrap.querySelectorAll('#f-day button').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });

  wrap.querySelector('#f-cancel').addEventListener('click', () => { editingStudent = null; wrap.remove(); });
  wrap.addEventListener('click', (e) => { if (e.target === wrap) { editingStudent = null; wrap.remove(); } });
  wrap.querySelector('#f-save').addEventListener('click', () => {
    const name = wrap.querySelector('#f-name').value.trim();
    const grade = wrap.querySelector('#f-grade').value.trim();
    const subject = wrap.querySelector('#f-subject').value.trim();
    const time = wrap.querySelector('#f-time').value;
    const note = wrap.querySelector('#f-note').value.trim();
    if (!name) { wrap.querySelector('#f-name').focus(); return; }
    saveStudent({ id: isNew ? null : s.id, name, grade, subject, day: selectedDay, time, note });
    editingStudent = null;
    wrap.remove();
    render();
  });
}

function renderMonth() {
  const year = monthCursor.getFullYear();
  const month = monthCursor.getMonth();
  const label = monthCursor.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' });
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  let html = `
    <div class="month-nav">
      <button id="m-prev">‹</button>
      <div class="label">${label}</div>
      <button id="m-next">›</button>
    </div>`;

  if (students.length === 0) {
    html += `<div class="card"><div class="empty">Önce öğrenci eklemelisin.</div></div>`;
    return html;
  }

  students.forEach(s => {
    const dates = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(year, month, d);
      if (dt.getDay() === s.day) dates.push(dt);
    }
    let done = 0, missed = 0;
    const chips = dates.map(dt => {
      const key = dateKey(dt);
      const rec = attendance[`${s.id}__${key}`];
      const isFuture = dt > today;
      let cls = 'future';
      if (!isFuture) {
        if (rec && rec.status === 'yes') { cls = 'done'; done++; }
        else if (rec && rec.status === 'no') { cls = 'missed'; missed++; }
        else if (dt < today && (!rec || rec.status !== 'note')) { cls = 'missed'; missed++; }
        else cls = '';
      }
      return `<div class="day-chip ${cls}"><div class="d">${dt.getDate()}</div></div>`;
    }).join('');

    html += `
      <div class="month-block">
        <div class="student-name">${escapeHtml(s.name)}</div>
        <div class="day-strip">${chips}</div>
        <div class="stats-line">${done} yapıldı · ${missed} eksik</div>
      </div>`;
  });

  return html;
}

function bindMonthEvents() {
  const prev = document.getElementById('m-prev');
  const next = document.getElementById('m-next');
  if (prev) prev.addEventListener('click', () => { monthCursor.setMonth(monthCursor.getMonth()-1); render(); });
  if (next) next.addEventListener('click', () => { monthCursor.setMonth(monthCursor.getMonth()+1); render(); });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;');
}

init();
</script>
